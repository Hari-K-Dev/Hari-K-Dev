<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Deckhand window layouts</title>
  <rect width="960" height="400" rx="18" fill="#F6EEE6"/>
  <defs>
    <g id="screen"><rect width="200" height="125" rx="8" fill="#2A2420"/></g>
  </defs>
  <style>
    .w { fill: #D97757; stroke: #2A2420; stroke-width: 3; }
    .s { fill: #E8A386; stroke: #2A2420; stroke-width: 3; }
    .l { fill: #3B302A; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .h { fill: #3B302A; font-size: 17px; font-weight: 700; }
    .n { fill: #FBF1E6; font-size: 14px; font-weight: 700; text-anchor: middle; }
  </style>

  <text class="h" x="40" y="40">Laptop only</text>

  <!-- 1 window -->
  <g transform="translate(40,60)">
    <use href="#screen"/>
    <rect class="w" x="4" y="4" width="192" height="117" rx="4"/>
    <text class="n" x="100" y="68">1</text>
    <text class="l" x="100" y="150">1: full screen</text>
  </g>
  <!-- 2 windows -->
  <g transform="translate(270,60)">
    <use href="#screen"/>
    <rect class="w" x="4" y="4" width="96" height="117" rx="4"/>
    <rect class="w" x="100" y="4" width="96" height="117" rx="4"/>
    <text class="n" x="52" y="68">1</text><text class="n" x="148" y="68">2</text>
    <text class="l" x="100" y="150">2: split screen</text>
  </g>
  <!-- 3 windows -->
  <g transform="translate(500,60)">
    <use href="#screen"/>
    <rect class="w" x="4" y="4" width="64" height="117" rx="4"/>
    <rect class="w" x="68" y="4" width="64" height="117" rx="4"/>
    <rect class="w" x="132" y="4" width="64" height="117" rx="4"/>
    <text class="n" x="36" y="68">1</text><text class="n" x="100" y="68">2</text><text class="n" x="164" y="68">3</text>
    <text class="l" x="100" y="150">3: three columns</text>
  </g>
  <!-- 4+ windows -->
  <g transform="translate(730,60)">
    <use href="#screen"/>
    <rect class="w" x="4" y="4" width="96" height="58" rx="4"/>
    <rect class="w" x="100" y="4" width="96" height="58" rx="4"/>
    <rect class="w" x="4" y="62" width="96" height="59" rx="4"/>
    <rect class="w" x="100" y="62" width="96" height="59" rx="4"/>
    <rect class="s" x="12" y="12" width="88" height="50" rx="4"/>
    <text class="n" x="56" y="42">5</text><text class="n" x="148" y="38">2</text>
    <text class="n" x="52" y="97">3</text><text class="n" x="148" y="97">4</text>
    <text class="l" x="100" y="150">4+: 2x2, extras stack</text>
  </g>

  <text class="h" x="40" y="250">With an external display</text>
  <!-- external + laptop, 5 windows -->
  <g transform="translate(40,268)">
    <rect width="300" height="100" rx="8" fill="#2A2420"/>
    <rect class="w" x="4" y="4" width="97" height="92" rx="4"/>
    <rect class="w" x="101" y="4" width="98" height="92" rx="4"/>
    <rect class="w" x="199" y="4" width="97" height="92" rx="4"/>
    <text class="n" x="52" y="55">1</text><text class="n" x="150" y="55">2</text><text class="n" x="248" y="55">3</text>
    <g transform="translate(320,16)">
      <rect width="130" height="84" rx="8" fill="#2A2420"/>
      <rect class="w" x="4" y="4" width="61" height="76" rx="4"/>
      <rect class="w" x="65" y="4" width="61" height="76" rx="4"/>
      <text class="n" x="34" y="47">4</text><text class="n" x="96" y="47">5</text>
    </g>
  </g>
  <text class="l" x="530" y="300" text-anchor="start" style="text-anchor:start">The first screen goes full, split, then thirds.</text>
  <text class="l" x="530" y="324" text-anchor="start" style="text-anchor:start">Window 4 moves to the other screen,</text>
  <text class="l" x="530" y="348" text-anchor="start" style="text-anchor:start">which does the same. You pick which goes first.</text>
</svg>
