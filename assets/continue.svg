<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="t d">
  <title id="t">Continue?</title>
  <desc id="d">An arcade continue screen counting down from nine to zero. Insert coin below: links to LinkedIn and email.</desc>
  <style>
    /* Press Start 2P by CodeMan38, SIL Open Font License 1.1 */
    @font-face { font-family: 'PS2P'; src: url(data:font/woff2;base64,) format('woff2'); }
    .px { font-family: 'PS2P', ui-monospace, Menlo, monospace; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.35"/></pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.6"/></radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="230" rx="18" fill="#05060f"/>
  <text x="320" y="66" class="px" font-size="30" fill="#ff2bd6" text-anchor="middle" filter="url(#glow)">CONTINUE?</text>
    <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">9<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.10;1.00" values="1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">8<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.10;0.20;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">7<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.20;0.30;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">6<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.30;0.40;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">5<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.40;0.50;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">4<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.50;0.60;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">3<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.60;0.70;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">2<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.70;0.80;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">1<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.80;0.90;1.00" values="0;1;0;0"/></text>
  <text x="320" y="150" class="px" font-size="56" fill="#ffe600" text-anchor="middle" opacity="0">0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.00;0.90;1.00" values="0;1;0"/></text>
  <text x="320" y="196" class="px blink" font-size="12" fill="#7df9ff" text-anchor="middle">INSERT COIN BELOW</text>
  <rect width="640" height="230" rx="18" fill="url(#scan)"/>
  <rect width="640" height="230" rx="18" fill="url(#vig)"/>
  <rect x="5" y="5" width="630" height="220" rx="14" fill="none" stroke="#ff2bd6" stroke-width="3" filter="url(#glow)" opacity="0.85"/>
</svg>
